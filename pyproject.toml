[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowprotect"
version = "0.1.1"
authors = [
  { name="ShadowProtect Contributors" },
]
description = "Wireshark for AI Agents: Real-time intrusion detection and protection."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.urls]
"Homepage" = "https://github.com/senseipri/ShadowProtect"
"Bug Tracker" = "https://github.com/senseipri/ShadowProtect/issues"

[tool.setuptools]
packages = ["shadowprotect"]
